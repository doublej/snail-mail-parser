buildDetailsJson={"buildFiles"\:["requirements.txt","setup.sh"],"dependencies"\:["watchdog","pillow","pytesseract","PyMuPDF","opencv-python-headless","openai","pydantic","pydantic-settings","ruamel.yaml","markdown-it-py","python-dotenv"],"buildLintCommand"\:"","testAllCommand"\:"","instructions"\:"\#\# Project Setup and Build Instructions for Development\\n\\nThis is a Python application. The primary build process involves setting up a Python virtual environment, installing dependencies, and configuring environment variables.\\n\\n**1. System Prerequisites\:**\\n   - Ensure `poppler-utils` is installed. On Debian-based systems\:\\n     ```bash\\n     sudo apt-get update\\n     sudo apt-get install -y poppler-utils\\n     ```\\n\\n**2. Python Virtual Environment\:**\\n   - It's highly recommended to use a Python virtual environment.\\n   - Create a virtual environment (e.g., named `.venv`)\:\\n     ```bash\\n     python -m venv .venv\\n     ```\\n   - Activate the virtual environment\:\\n     - On macOS and Linux\:\\n       ```bash\\n       source .venv/bin/activate\\n       ```\\n     - On Windows\:\\n       ```bash\\n       .venv\\\\Scripts\\\\activate\\n       ```\\n\\n**3. Install Python Dependencies\:**\\n   - The project uses `uv` for faster dependency management in `setup.sh`, but `pip` can also be used.\\n   - Upgrade pip (optional but recommended)\:\\n     ```bash\\n     pip install --upgrade pip\\n     \# or using uv as in setup.sh\\n     \# uv pip install --upgrade pip \\n     ```\\n   - Install dependencies from `requirements.txt`\:\\n     ```bash\\n     pip install -r requirements.txt\\n     \# or using uv as in setup.sh\\n     \# uv pip install -r requirements.txt\\n     ```\\n\\n**4. Configuration\:**\\n   - The application uses a `.env` file for configuration.\\n   - The `setup.sh` script creates a `.env.template` file and copies it to `.env`.\\n     If you don't run `setup.sh`, you might need to copy it manually\: `cp .env.template .env`.\\n   - **Crucial\:** Edit the `.env` file with your specific settings\:\\n     ```env\\n     \# Directory to watch for incoming files\\n     SCAN_DIR\=/path/to/your/scan/directory\\n     \# Directory to write output YAML and Markdown\\n     OUTPUT_DIR\=/path/to/your/output/directory\\n     \# Session timeout (seconds)\\n     SESSION_TIMEOUT_S\=15\\n     \# Maximum concurrent processing jobs\\n     MAX_INFLIGHT\=1\\n     \# OpenAI/OpenRouter API settings\\n     LLM_API_KEY\=your_actual_api_key\\n     LLM_MODEL\=openai/gpt-4o \# or your preferred model\\n     LLM_BASE_URL\=https\://openrouter.ai/api/v1 \# or your LLM provider's base URL\\n     ```\\n\\n**5. Running the Application\:**\\n   - The main entry point for the application is `main.py`.\\n   - To run the application\:\\n     ```bash\\n     python main.py\\n     ```\\n   - The application supports a `--flush` argument to process all pending sessions immediately on startup\:\\n     ```bash\\n     python main.py --flush\\n     ```\\n\\n**6. Build Commands (Python Context)\:**\\n   - **Clean\:** There's no explicit clean command. To perform a clean setup, you would typically\:\\n     1. Deactivate and remove the virtual environment\: `deactivate` (if active) then `rm -rf .venv`.\\n     2. Remove Python bytecode cache directories\: `find . -name \\"__pycache__\\" -type d -exec rm -rf {} +`.\\n     3. Then, restart the setup from step 2.\\n   - **Compile/Build\:** For Python, the \\"build\\" process is primarily installing dependencies (see step 3). There is no separate compilation step for the Python code itself.\\n\\n**7. Testing\:**\\n   - No automated test files (e.g., `test_*.py` or `*_test.py`) or testing framework (like pytest or unittest) were identified in the project structure or `requirements.txt`.\\n   - Testing appears to be manual by running the application.\\n   - **Test All Command\:** Not available.\\n   - **Test Specific Command\:** Not available.\\n\\n**8. Linting and Formatting\:**\\n   - No specific linters (e.g., Flake8, Pylint, Ruff) or code formatters (e.g., Black, Yapf) are explicitly defined in `requirements.txt` or project setup scripts.\\n   - **Build/Lint Command\:** Not available.\\n\\n**9. Main Application Entry Point\:**\\n   - `main.py`\\n\\n**10. Key Files\:**\\n    - `requirements.txt`\: Lists Python dependencies.\\n    - `setup.sh`\: Shell script for initial environment setup (system dependencies, Python dependencies, .env file creation).\\n    - `main.py`\: Main application script.\\n    - `settings.py`\: Handles loading configurations from the .env file.\\n    - `.env`\: Local environment configuration file (created from `.env.template`).","excludedDirectories"\:["*.egg-info","build",".pytest_cache","__pycache__",".tox","dist",".venv",".mypy_cache"]}
